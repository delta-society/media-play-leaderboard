name: Ghost Content Collection

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  collect-ghost:
    runs-on: ubuntu-latest

    steps:
      - name: Collect Ghost posts
        run: |
          curl -X POST \
            "${{ secrets.APP_URL }}/api/collect/ghost" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
